# This is a YAML-formatted file.
replicaCount: 1

argoRollout:
  enabled: false

nameOverride: "codemie"
fullnameOverride: "codemie"

extraEnv:
  - name: MODELS_ENV
    value: "amnaairn"
  - name: ENV
    value: "prod"
  - name: CODEMIE_DOMAIN
    valueFrom:
      configMapKeyRef:
        name: codemie-config
        key: CODEMIE_DOMAIN_NAME
  - name: ENCRYPTION_TYPE
    value: "aws"
  - name: FILES_STORAGE_TYPE
    value: "aws"
  - name: AWS_DEFAULT_REGION
    valueFrom:
      configMapKeyRef:
        name: codemie-config
        key: AWS_DEFAULT_REGION
  - name: AWS_KMS_KEY_ID
    valueFrom:
      configMapKeyRef:
        name: codemie-config
        key: AWS_KMS_KEY_ID
  - name: AWS_S3_BUCKET_NAME
    valueFrom:
      configMapKeyRef:
        name: codemie-config
        key: AWS_S3_BUCKET_NAME
  - name: AWS_S3_REGION
    valueFrom:
      configMapKeyRef:
        name: codemie-config
        key: AWS_S3_REGION
  # NATS Configuration
  - name: NATS_PLUGIN_KEY_CHECK_ENABLED
    value: "true"
  - name: NATS_SKIP_TLS_VERIFY
    value: "false"
  - name: NATS_CLIENT_CONNECT_URI
    value: "tls://codemie-nats.$(CODEMIE_DOMAIN):30422"
  - name: NATS_SERVERS_URI
    valueFrom:
      secretKeyRef:
        name: codemie-nats-secrets
        key: NATS_URL
  - name: NATS_USER
    valueFrom:
      secretKeyRef:
        name: codemie-nats-secrets
        key: CODEMIE_USERNAME
  - name: NATS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: codemie-nats-secrets
        key: CODEMIE_PASSWORD
  - name: API_ROOT_PATH
    value: "/code-assistant-api"
  - name: AMNA_AIRN_PRECREATE_WORKFLOWS
    value: "true"
  - name: CALLBACK_API_BASE_URL
    value: "codemie.$(CODEMIE_DOMAIN)"
  - name: TRIGGER_ENGINE_ENABLED
    value: "false"

    # MCP_CONNECT_ENABLED is used to enable/disable the MCP Connect functionality.
  - name: MCP_CONNECT_ENABLED
    value: "true"
  # MCP_CONNECT_BUCKETS_COUNT is used to set the number of buckets for MCP Connect. It is equal to the number of codemie-mcp-connect-service pods.
  - name: MCP_CONNECT_BUCKETS_COUNT
    value: "1"
  - name: MCP_CONNECT_URL
    value: "http://codemie-mcp-connect-service-{MCP_CONNECT_BUCKET}.codemie-mcp-connect-service-headless:3000"
  - name: MCP_CLIENT_TIMEOUT
    value: "600.0"
  - name: MERMAID_USE_MERMAID_INC
    value: "false"
  - name: MERMAID_SERVER_URL
    value: "http://mermaid-server:8000"
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: codemie-postgresql
        key: password
  - name: POSTGRES_USER
    valueFrom:
      secretKeyRef:
        name: codemie-postgresql
        key: user
  - name: POSTGRES_HOST
    valueFrom:
      secretKeyRef:
        name: codemie-postgresql
        key: db-url
  - name: POSTGRES_DB
    valueFrom:
      secretKeyRef:
        name: codemie-postgresql
        key: db-name
  - name: PG_URL
    value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)"

  - name: LLM_REQUEST_ADD_MARKDOWN_PROMPT
    value: "false"

  # User Accounts
  - name: ENABLE_USER_MANAGEMENT
    value: "true"
  - name: EMAIL_VERIFICATION_ENABLED
    value: "false"
  - name: SUPERADMIN_EMAIL
    valueFrom:
      secretKeyRef:
        name: codemie-access
        key: email
  - name: SUPERADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: codemie-access
        key: password

  # Add extra environment variables that extend and/or override extraEnv
  # -- Use this to add or override environment variables
customEnv:
  - name: 'ELASTIC_USERNAME'
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: username
  - name: 'ELASTIC_PASSWORD'
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: password
  - name: 'ELASTIC_URL'
    value: "https://elasticsearch-master.elastic.svc.cluster.local:9200"


# TODO: Check for the necessity
#
#    - name: 'KEYCLOAK_LOGOUT_URL'
#      value: 'https://codemie.$(CODEMIE_DOMAIN)/oauth2/sign_out?rd=/oauth2/sign_in'

externalSecrets:
  enabled: false

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "codemie"

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/auth-response-headers: null
    nginx.ingress.kubernetes.io/auth-signin: null
    nginx.ingress.kubernetes.io/auth-url: null
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-body-size: 900m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "64k"
  pathType: ImplementationSpecific
  path: "/code-assistant-api/(.*)"
  tls: []

ingressSwagger:
  annotations: {}

ingressWebHooks:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /v1/webhooks/$1

# Is used to avoid pod restarts when the pod is starting when we are executing the migration script.
# Pod has 600 seconds to start and execute the migration script.
# failureThreshold * periodSeconds = 60 * 10 = 600 seconds = 10 minutes
startupProbe:
  httpGet:
    path: /v1/healthcheck
    port: 8080
  initialDelaySeconds: 20
  failureThreshold: 60
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /v1/healthcheck
    port: 8080
  failureThreshold: 3
  initialDelaySeconds: 20
  periodSeconds: 30
  successThreshold: 1
  timeoutSeconds: 1

readinessProbe:
  httpGet:
    path: /v1/healthcheck
    port: 8080
  failureThreshold: 3
  initialDelaySeconds: 20
  periodSeconds: 30
  successThreshold: 1
  timeoutSeconds: 1

resources:
  limits:
    cpu: 2
    memory: 2048Mi
  requests:
    cpu: 1
    memory: 2048Mi

# hostAliases is a list of aliases to be added to /etc/hosts for network name resolution
hostAliases: []

# -- Priority class for the pod
priorityClassName: ""

nodeSelector: {}

tolerations: []

affinity: {}

extraVolumeMounts: |
  - name: codemie-ui
    mountPath: /codemie-ui
  - name: codemie-keys
    mountPath: /app/.keys/jwt_private.pem
    subPath: jwt_private.pem
    readOnly: true
  - name: codemie-keys
    mountPath: /app/.keys/jwt_public.pem
    subPath: jwt_public.pem
    readOnly: true
  - name: codemie-customer-amna-config-vol
    mountPath: /app/config/customer
  - name: codemie-llm-customer-config
    mountPath: /app/config/llms/llm-amnaairn-config.yaml
    subPath: llm-amnaairn-config.yaml

